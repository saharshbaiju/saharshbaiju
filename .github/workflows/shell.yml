name: shell

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  run:
    if: startsWith(github.event.issue.title, '$')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Execute command
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
          CMD_TITLE: ${{ github.event.issue.title }}
          CMD_USER: ${{ github.event.issue.user.login }}
          CMD_ISSUE: ${{ github.event.issue.number }}
        run: |
          python -m gen.shell
          python -m gen
      - name: Reply and close
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body-file reply.md
          gh issue close ${{ github.event.issue.number }} --reason completed
      - name: Commit session
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets gen/data/session.json
          git diff --cached --quiet && exit 0
          git commit -m "shell: ${{ github.event.issue.user.login }} ran a command"
          git pull --rebase -X theirs origin main
          git push
